name: Mise à jour des vidéos
on:
  schedule: [{ cron: '0 5 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-videos.mjs
      - name: Commit si changement
        run: |
          git config user.name "student-hub-bot"
          git config user.email "student-hub-bot@users.noreply.github.com"
          git add data/videos.json
          git diff --staged --quiet || (git commit -m "chore: mise à jour des vidéos" && git push)
